name: iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: flutter pub get
    - run: flutter build ipa --release
    - uses: actions/upload-artifact@v4
      with:
        name: SnakeGame.ipa
        path: build/ios/ipa/*.ipa