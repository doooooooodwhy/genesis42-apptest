name: iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: flutter pub get
    - name: Generate Flutter files
      run: flutter build ios --release --no-codesign 2>&1 || true
    - name: Build with xcodebuild
      run: |
        xcodebuild \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/ios/output \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/ios/output/Build/Products/Release-iphoneos/Runner.app Payload/
        zip -r MyTube.ipa Payload/
    - uses: actions/upload-artifact@v4
      with:
        name: MyTube.ipa
        path: MyTube.ipa