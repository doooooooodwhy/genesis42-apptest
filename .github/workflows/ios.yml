name: iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: flutter pub get
    - run: flutter build ios --release --no-codesign
    - run: mkdir -p build/iphoneos/Payload/Runner.app
    - run: cp -r build/ios/iphoneos/Runner.app/* build/iphoneos/Payload/Runner.app/
    - run: zip -r app.ipa build/iphoneos/Payload/
    - uses: actions/upload-artifact@v4
      with:
        name: app.ipa
        path: app.ipa