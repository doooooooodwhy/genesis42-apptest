name: iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: flutter pub get
    - run: flutter build ios-framework --release
    - name: Create IPA
      run: |
        mkdir -p Payload
        find build/ios/framework -name "*.framework" -type d | head -1 | xargs -I {} cp -r {} Payload/
        zip -r MyTube.ipa Payload/
    - uses: actions/upload-artifact@v4
      with:
        name: MyTube.ipa
        path: MyTube.ipa