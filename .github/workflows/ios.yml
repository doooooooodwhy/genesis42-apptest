name: iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: flutter pub get
    - run: mkdir Payload
    - run: cp -r ios/Runner.app Payload/
    - run: zip -r app.ipa Payload/
    - uses: actions/upload-artifact@v4
      with:
        name: app.ipa
        path: app.ipa